name: ⚙️ Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: provide-io/ci-tooling/.github/workflows/python-ci.yml@v0
    with:
      python-version: '3.11'
      platform-preset: standard
      coverage-threshold: 0
      run-security: true
      # A known vulnerability in the lock reddens this build rather
      # than filing a report nobody reads. The lock is clean: 175
      # packages, no advisories.
      fail-on-vulnerability: true
      run-secret-scan: true
      # The child-environment tests launch a process with exactly `base_env()`,
      # and the variables that scrub must forward are Windows' own. Running them
      # anywhere else exercises the POSIX branch and proves nothing about the
      # platform the scrub broke. amd64 only: windows-11-arm cannot install
      # grpcio or cryptography, so `include-windows-arm` would be red always.
      include-windows: true
      matrix-testing: false
      parallel-testing: false
      # This repository points its siblings at ../<repo> as editable path
      # dependencies so a change in one is exercised by its consumers
      # immediately. CI checks out a single repository, so those paths do not
      # exist here and `uv sync` cannot resolve them -- it fails with "Failed to
      # generate package metadata for `plating @ editable+../plating`" before a
      # single test runs. The published metadata is also what CI should be
      # verifying. Same flag, same reason, as pyvider-cty's.
      no-sources: true
    secrets: inherit
